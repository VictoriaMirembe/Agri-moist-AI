{% extends "base.html" %}
{% block title %}My advice{% endblock %}
{% block content %}
<p><a href="/farmer/home?phone={{ phone|urlencode }}">&larr; Back</a></p>
<h1>My advice</h1>
<div id="content" class="card muted">Loading...</div>

<script>
const phone = {{ phone|tojson }};
(async () => {
  const el = document.getElementById("content");
  try {
    const info = await getJSON("/api/farmer/advice?phone=" + encodeURIComponent(phone));
    if (!info.has_advice) {
      el.textContent = "No new advice yet. Your officer will send it after checking.";
      return;
    }
    el.innerHTML = `<p>${info.text}</p><p class="muted">${info.officer_name ? "Approved by " + info.officer_name + ", " : ""}${info.date.slice(0,10)}${info.language !== 'English' ? " (" + info.language + ")" : ""}</p>`;
  } catch (err) {
    el.textContent = err.message;
  }
})();
</script>
{% endblock %}
