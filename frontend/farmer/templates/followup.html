{% extends "base.html" %}
{% block title %}Did advice help?{% endblock %}
{% block content %}
<p><a href="/farmer/home?phone={{ phone|urlencode }}">&larr; Back</a></p>
<h1>Did advice help?</h1>
<div id="loading" class="muted">Loading...</div>
<form id="form" style="display:none;">
  <label for="followed">Did you follow the last advice?</label>
  <select id="followed">
    <option value="yes">Yes</option>
    <option value="partly">Partly</option>
    <option value="no">No</option>
  </select>
  <label for="helped">Did it help?</label>
  <select id="helped">
    <option value="yes">Yes</option>
    <option value="no">No</option>
    <option value="">Too early to say</option>
  </select>
  <p id="error" class="pill red" style="display:none;margin-top:0.8rem;"></p>
  <button class="btn big" type="submit" style="margin-top:1rem;">Send</button>
</form>
<div id="done" class="card" style="display:none;">Thank you. This helps improve advice.</div>
<div id="none" class="card" style="display:none;">You have no approved advice to answer about yet.</div>

<script>
const phone = {{ phone|tojson }};
let adviceId = null;

(async () => {
  try {
    const info = await getJSON("/api/farmer/advice?phone=" + encodeURIComponent(phone));
    document.getElementById("loading").style.display = "none";
    if (!info.has_advice) {
      document.getElementById("none").style.display = "block";
      return;
    }
    adviceId = info.advice_id;
    document.getElementById("form").style.display = "block";
  } catch (err) {
    document.getElementById("loading").textContent = err.message;
  }
})();

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("error");
  errorEl.style.display = "none";
  try {
    await postJSON("/api/farmer/followup", {
      phone, advice_id: adviceId,
      followed: document.getElementById("followed").value,
      helped: document.getElementById("helped").value || null,
    });
    document.getElementById("form").style.display = "none";
    document.getElementById("done").style.display = "block";
  } catch (err) {
    showError(errorEl, err);
  }
});
</script>
{% endblock %}
