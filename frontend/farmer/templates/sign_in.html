{% extends "base.html" %}
{% block title %}TerraMoist AI - Portal Login{% endblock %}
{% block content %}
<section class="login-page">
  <div class="login-card">
    <h1>TerraMoist AI</h1>
    <p class="login-intro">Log in to access your farmer portal</p>

    <form id="sign-in-form">
      <label for="phone">Phone number</label>
      <input id="phone" name="phone" type="tel" inputmode="tel"
             placeholder="+256700000001" autocomplete="tel" required>
      <button class="btn big" type="submit">Log in</button>
    </form>

    <p id="error" class="login-error" role="alert" hidden></p>
    <p class="login-demo">Demo numbers: +256700000001 to +256700000010</p>
    <p class="login-demo"><a href="/officer/login">Extension officer sign in</a></p>
  </div>
</section>

<script>
document.getElementById("sign-in-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const phone = document.getElementById("phone").value.trim();
  const errorEl = document.getElementById("error");
  errorEl.hidden = true;
  const submitButton = e.currentTarget.querySelector('button[type="submit"]');
  submitButton.disabled = true;
  try {
    const form = new FormData();
    form.set("phone", phone);
    const response = await fetch("/api/login", { method: "POST", body: form });
    const result = await response.json();
    if (!response.ok) {
      throw new Error(result.detail || response.statusText);
    }
    window.location.href = result.redirect_url;
  } catch (err) {
    errorEl.textContent = err.message || "Network error. Please try again.";
    errorEl.hidden = false;
    submitButton.disabled = false;
  }
});
</script>
{% endblock %}
