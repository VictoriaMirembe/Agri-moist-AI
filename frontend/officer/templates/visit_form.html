{% extends "base.html" %}
{% block title %}Record visit{% endblock %}
{% block content %}
<h1>Record a visit</h1>
<div class="card">
  <form id="visit-form">
    <label for="household_code">Household</label>
    <select id="household_code" required>
      {% for h in households %}
      <option value="{{ h.code }}">{{ h.code }} (group {{ h.group_id }})</option>
      {% endfor %}
    </select>

    <label for="officer_id">Officer</label>
    <select id="officer_id" required>
      {% for o in officers %}
      <option value="{{ o.id }}">{{ o.name }}</option>
      {% endfor %}
    </select>

    <label for="crop">Crop</label>
    <select id="crop">
      <option value="sorghum">Sorghum</option>
      <option value="maize">Maize</option>
      <option value="">Other / not applicable</option>
    </select>

    <label for="soil_wetness">Soil wetness</label>
    <select id="soil_wetness">
      <option value="dry">Dry</option>
      <option value="moist">Moist</option>
      <option value="wet">Wet</option>
    </select>

    <label for="rain_last_7_days">Rain in the last 7 days</label>
    <select id="rain_last_7_days">
      <option value="none">None</option>
      <option value="some">Some</option>
      <option value="heavy">Heavy</option>
    </select>

    <label for="pest_seen">Pests seen (leave blank if none)</label>
    <input id="pest_seen" type="text" placeholder="e.g. fall armyworm">

    <label for="crop_condition">Crop condition</label>
    <select id="crop_condition">
      <option value="good">Good</option>
      <option value="fair">Fair</option>
      <option value="poor">Poor</option>
    </select>

    <label for="food_left">Food left at the household</label>
    <select id="food_left">
      <option value="enough">Enough</option>
      <option value="little">Little</option>
      <option value="none">None</option>
    </select>

    <label for="notes">Notes</label>
    <textarea id="notes" placeholder="Anything else worth recording"></textarea>

    <label><input type="checkbox" id="consent" style="width:auto;display:inline-block;margin-right:0.5rem;" required> The household has given consent for this visit to be recorded</label>

    <p id="error" class="pill red" style="display:none;margin-top:1rem;"></p>
    <button class="btn" type="submit" style="margin-top:1rem;">Save visit</button>
  </form>
</div>

<script>
document.getElementById("visit-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("error");
  errorEl.style.display = "none";
  try {
    const body = {
      household_code: document.getElementById("household_code").value,
      officer_id: parseInt(document.getElementById("officer_id").value, 10),
      crop: document.getElementById("crop").value || null,
      soil_wetness: document.getElementById("soil_wetness").value,
      rain_last_7_days: document.getElementById("rain_last_7_days").value,
      pest_seen: document.getElementById("pest_seen").value || null,
      crop_condition: document.getElementById("crop_condition").value,
      food_left: document.getElementById("food_left").value,
      notes: document.getElementById("notes").value || null,
    };
    const result = await postJSON("/api/visits", body);
    window.location.href = "/groups/" + result.group_id;
  } catch (err) {
    showError(errorEl, err);
  }
});
</script>
{% endblock %}
